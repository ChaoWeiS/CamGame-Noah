<!DOCTYPE html>
<html lang="en">
<head>
<meta name="build" content="1125-205249-tv-screen">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Character Test — Race to the Ark</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc6e6; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; }
  #panel {
    position: absolute; left: 16px; top: 16px; width: 260px; padding: 14px; border-radius: 14px;
    background: rgba(13, 27, 38, 0.85); color: #fff8e6; font-size: 14px; text-align: center;
  }
  #panel h2 { margin: 0 0 8px; font-size: 18px; }
  #qr { width: 150px; background: #fff; border-radius: 8px; image-rendering: pixelated; }
  #room { font-size: 20px; font-weight: 800; color: #f2b544; margin: 4px 0; }
  #link { color: #9fd6ef; font-size: 11px; word-break: break-all; }
  button { font: inherit; margin-top: 10px; padding: 8px 12px; border: 0; border-radius: 8px; background: #2b3b47; color: #fff8e6; cursor: pointer; }
  #status, #hint { margin-top: 8px; opacity: 0.85; }
  #hint { font-size: 12px; }
  #panel.min > :not(h2) { display: none; }
  #chars button { margin: 4px 2px 0; padding: 6px 10px; }
  #chars button.on { background: #f2b544; color: #1d1d1d; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="panel">
  <h2 id="title">3D character test</h2>
  <div id="chars"></div>
  <img id="qr" alt="QR code for the phone camera">
  <div id="room">…</div>
  <a id="link" target="_blank"></a>
  <div><button id="camBtn">Use this computer’s webcam</button></div>
  <div id="status">Starting…</div>
  <div id="hint">Stand back so your whole body is in view. Your character copies your arms, legs, leaning and jumps. Drag to look around · H hides this panel.</div>
</div>
<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module">
// Version check. GitHub Pages lets browsers keep files for 10 minutes, so before
// starting, make sure this page and all its code are the newest build.
const BUILD = document.querySelector('meta[name=build]').content;
try {
  const v = await fetch('version.json', { cache: 'no-store' }).then((r) => r.json());
  const u = new URL(location.href);
  if (v.build !== BUILD && u.searchParams.get('v') !== v.build) {
    u.searchParams.set('v', v.build);                    // the page itself is old: reload it past the cache
    location.replace(u);
    await new Promise(() => {});
  }
  if (localStorage.getItem('ark-build') !== v.build) {    // new build: refresh every code file in the cache
    await Promise.all(v.files.map((f) => fetch(f, { cache: 'reload' }).catch(() => {})));
    try { localStorage.setItem('ark-build', v.build); } catch (_) {}
  }
} catch (_) { /* offline or no version.json: just start */ }
await import('./js/bear3d.js');
</script>
</body>
</html>

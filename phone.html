<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race to the Ark — Camera</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #10202b; color: #f4f1e8; }
  header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; flex: 1; }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #2b3b47; }
  .ok { background: #2e7d4f; } .bad { background: #9b3b2f; } .wait { background: #8a6d1f; }
  #stage { position: relative; width: 100%; background: #000; aspect-ratio: 4 / 3; overflow: hidden; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .hidden-preview video { visibility: hidden; }
  .controls { padding: 12px 16px; display: grid; gap: 10px; }
  button, select, input { font: inherit; font-size: 16px; padding: 12px; border-radius: 10px; border: 0; }
  button { background: #f2b544; color: #1d1d1d; font-weight: 600; }
  button.secondary { background: #2b3b47; color: #f4f1e8; }
  select, input { background: #1d2f3b; color: #f4f1e8; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .tip { font-size: 13px; opacity: 0.8; line-height: 1.4; }
  #msg { font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>🛶 Race to the Ark · Camera</h1>
  <span id="conn" class="pill wait">Not connected</span>
</header>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div class="controls">
  <div class="stats">
    <span class="pill" id="fps">0 fps</span>
    <span class="pill" id="inf">– ms</span>
    <span class="pill" id="people">0 people</span>
    <span class="pill" id="engine">engine –</span>
  </div>
  <div id="msg"></div>
  <input id="room" placeholder="Room code (shown on the big screen)" autocomplete="off" autocapitalize="off">
  <button id="start">Start camera</button>
  <select id="camera" hidden></select>
  <button id="preview" class="secondary" hidden>Hide preview (saves battery)</button>
  <p class="tip">Prop the phone up sideways (landscape), about 3 m from the players, so everyone fits head to toe. Everything stays on this phone and the big screen — only stick-figure points are sent, never video.</p>
</div>

<script src="vendor/peerjs.min.js"></script>
<script type="module">
import { createPoseDetector, BONES } from './js/pose.js';

const $ = (id) => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), ctx = overlay.getContext('2d');
const params = new URLSearchParams(location.search);
$('room').value = params.get('room') || location.hash.replace('#', '') || '';

let detector = null, stream = null, running = false, conn = null, peer = null;
let frames = 0, lastFpsT = performance.now(), fps = 0, lastInf = 0;
let showPreview = true, wakeLock = null;

function setConn(text, cls) { const el = $('conn'); el.textContent = text; el.className = 'pill ' + cls; }
function msg(t) { $('msg').textContent = t; }

// ---------- networking ----------
function connect() {
  const room = $('room').value.trim();
  if (!room) { setConn('No room code', 'bad'); return; }
  if (!peer || peer.destroyed) {
    peer = new Peer();
    peer.on('open', () => openConn(room));
    peer.on('error', (e) => { console.warn(e); setConn('Error: ' + e.type, 'bad'); retry(); });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (_) {} });
  } else if (peer.open) {
    openConn(room);
  }
}
function openConn(room) {
  setConn('Connecting…', 'wait');
  conn = peer.connect(room, { reliable: false, serialization: 'json' });
  conn.on('open', () => {
    setConn('Connected', 'ok');
    conn.send({ type: 'hello', ua: navigator.userAgent, camera: currentCameraLabel() });
  });
  conn.on('data', (d) => {
    if (d && d.type === 'ping') conn.send({ type: 'pong', t: d.t });
  });
  conn.on('close', () => { setConn('Disconnected — retrying', 'bad'); conn = null; retry(); });
  conn.on('error', () => { setConn('Connection error', 'bad'); });
}
let retryTimer = null;
function retry() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { if (!conn || !conn.open) connect(); }, 2500);
}
function send(obj) { if (conn && conn.open) { try { conn.send(obj); } catch (_) {} } }

// ---------- camera ----------
function currentCameraLabel() {
  const t = stream && stream.getVideoTracks()[0];
  return t ? t.label : '';
}
async function startCamera(deviceId) {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  const constraints = {
    audio: false,
    video: deviceId
      ? { deviceId: { exact: deviceId }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }
      : { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
  };
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;
  await video.play();
  await fillCameraList();
  send({ type: 'hello', ua: navigator.userAgent, camera: currentCameraLabel() });
}
async function fillCameraList() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
  const sel = $('camera');
  const current = stream.getVideoTracks()[0].getSettings().deviceId;
  sel.innerHTML = '';
  devices.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = d.deviceId; o.textContent = d.label || `Camera ${i + 1}`;
    if (d.deviceId === current) o.selected = true;
    sel.appendChild(o);
  });
  sel.hidden = devices.length < 2;
}
$('camera').addEventListener('change', (e) => startCamera(e.target.value).catch((err) => msg('Camera error: ' + err.message)));

async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) keepAwake(); });

// ---------- main loop ----------
function loop() {
  if (!running) return;
  if (video.readyState >= 2 && video.videoWidth) {
    const { poses, ms } = detector.detect(video);
    lastInf = ms;
    frames++;
    const aspect = video.videoWidth / video.videoHeight;
    send({ type: 'pose', t: performance.now(), inf: Math.round(ms), fps, aspect, poses });
    draw(poses);
    $('people').textContent = `${poses.length} ${poses.length === 1 ? 'person' : 'people'}`;
  }
  const now = performance.now();
  if (now - lastFpsT > 1000) {
    fps = Math.round((frames * 1000) / (now - lastFpsT));
    frames = 0; lastFpsT = now;
    $('fps').textContent = fps + ' fps';
    $('inf').textContent = Math.round(lastInf) + ' ms';
  }
  requestAnimationFrame(loop);
}

const COLORS = ['#f2b544', '#5ec8e5', '#f27a9b', '#8be07a'];
function draw(poses) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (overlay.width !== vw) { overlay.width = vw; overlay.height = vh; }
  ctx.clearRect(0, 0, vw, vh);
  if (!showPreview) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, vw, vh); }
  poses.forEach((p, k) => {
    ctx.strokeStyle = COLORS[k % COLORS.length]; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (const [a, b] of BONES) {
      if (p[a * 3 + 2] < 0.4 || p[b * 3 + 2] < 0.4) continue;
      ctx.beginPath();
      ctx.moveTo(p[a * 3] * vw, p[a * 3 + 1] * vh);
      ctx.lineTo(p[b * 3] * vw, p[b * 3 + 1] * vh);
      ctx.stroke();
    }
    ctx.fillStyle = COLORS[k % COLORS.length];
    ctx.beginPath(); ctx.arc(p[0] * vw, p[1] * vh, 10, 0, Math.PI * 2); ctx.fill();
  });
}

$('start').addEventListener('click', async () => {
  $('start').disabled = true;
  try {
    connect();
    msg('Starting camera…');
    await startCamera();
    if (!detector) {
      detector = await createPoseDetector({ numPoses: 4, onStatus: msg });
      $('engine').textContent = 'engine ' + detector.delegate;
    }
    msg('Running. You can leave this screen on.');
    running = true;
    keepAwake();
    $('start').hidden = true; $('room').hidden = true;
    $('preview').hidden = false;
    loop();
  } catch (e) {
    console.error(e);
    msg('Error: ' + (e.message || e));
    $('start').disabled = false;
  }
});

$('preview').addEventListener('click', () => {
  showPreview = !showPreview;
  document.body.classList.toggle('hidden-preview', !showPreview);
  $('preview').textContent = showPreview ? 'Hide preview (saves battery)' : 'Show preview';
});
</script>
</body>
</html>

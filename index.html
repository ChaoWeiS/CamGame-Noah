<style>
  html, body { margin: 0; height: 100%; background: #10202b; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  #wrap { --ar: 1.7778; position: absolute; inset: 0; margin: auto; width: min(100vw, calc(100vh * var(--ar))); height: min(100vh, calc(100vw / var(--ar))); }
  #game { position: absolute; inset: 0; }
  /* the lobby's corner card: QR code to add a camera, buttons (the camera view fills the screen) */
  #lobby {
    position: absolute; right: 1.2%; bottom: 2%; max-width: 19%;
    background: rgba(13, 27, 38, 0.82); border-radius: 14px; color: #fff8e6;
    display: flex; flex-direction: column; align-items: center; gap: 0.7vh;
    padding: 1.2vh 1vw; box-sizing: border-box; text-align: center; font-size: clamp(10px, 1.35vh, 15px);

  #lobby.center { right: 50%; bottom: 50%; transform: translate(50%, 50%); max-width: 60%; font-size: clamp(12px, 2.2vh, 20px); padding: 3vh 3vw; }
  #lobby[hidden] { display: none; }
  #lobby h2 { margin: 0; font-size: 1.15em; }
  #qr { width: 13vh; max-width: 100%; image-rendering: pixelated; background: #fff; border-radius: 8px; }
  #room { font-size: 1.4em; font-weight: 800; letter-spacing: 0.08em; color: #f2b544; }
  #link { color: #9fd6ef; font-size: 0.75em; word-break: break-all; }
  #status { min-height: 1.2em; font-size: 0.9em; opacity: 0.9; }
  #lobby .row { display: flex; gap: 0.4vw; flex-wrap: wrap; justify-content: center; }
  #lobby button { font: inherit; padding: 0.45em 0.8em; border-radius: 8px; border: 0; background: #2b3b47; color: #fff8e6; cursor: pointer; }
  #lobby button:hover { background: #3a4f5e; }
  #kbhelp { font-size: 0.65em; opacity: 0.6; max-width: 22em; }
  /* the host's menu */
  #menu { position: absolute; inset: 0; z-index: 45; overflow-y: auto; box-sizing: border-box; padding: 3vh 4vw 5vh;

  #menu[hidden] { display: none; }
  #menu h1 { margin: 0 0 1vh; font-size: clamp(26px, 5vh, 52px); }

  #menu .mlabel small { font-weight: 400; opacity: 0.7; }
  #mQueue { align-self: stretch; display: flex; gap: 12px; padding: 12px; min-height: 18vh; overflow-x: auto;

  .mq { position: relative; flex: 0 0 auto; width: 16vh; height: 16vh; border-radius: 12px; overflow: hidden;

  .mq img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .mq span { position: absolute; left: 6px; top: 6px; background: #1d3b52; color: #fff8e6; border-radius: 50%;

  .mq b { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; background: rgba(13,27,38,0.7); color: #fff8e6;

  .mq.drag { transition: none; z-index: 5; cursor: grabbing; box-shadow: 0 10px 24px rgba(0,0,0,0.3); }

  .mq.pop { animation: pop 0.3s ease-out; }
  @keyframes pop { from { transform: scale(0.6); } }
  .mq.plus { background: transparent; border: 3px dashed rgba(29,59,82,0.35); box-shadow: none; cursor: pointer; display: grid; place-items: center; }
  .mq.plus span { position: static; background: none; color: rgba(29,59,82,0.5); font-size: 7vh; width: auto; height: auto; }
  #mInfo { opacity: 0.75; }
  #mStart { font: 700 clamp(18px, 3vh, 28px) system-ui, sans-serif; padding: 0.6em 2.4em; border: 0; border-radius: 14px;

  #mStart:disabled { opacity: 0.4; cursor: default; }
  #mGrid { align-self: stretch; display: grid; grid-template-columns: repeat(auto-fill, minmax(20vh, 1fr)); gap: 16px; }
  .mcard { border: 0; padding: 0; border-radius: 14px; overflow: hidden; background: #fff8e6; cursor: pointer; text-align: left;

  .mcard:hover { transform: translateY(-2px); }
  .mcard img { width: 100%; aspect-ratio: 1; object-fit: cover; }
  .mcard b { padding: 8px 10px 0; } .mcard small { padding: 2px 10px 10px; opacity: 0.7; }
  /* linking cameras */
  #calib { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;

  #calib[hidden] { display: none; }
  #calib .cbox { background: rgba(16, 32, 43, 0.96); border-radius: 18px; padding: 2.2vh 2.5vw; width: min(640px, 80%);
    display: flex; flex-direction: column; gap: 1.2vh; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  #calib h2 { margin: 0; font-size: clamp(22px, 4vh, 40px); }
  #cSay { font-size: clamp(16px, 2.6vh, 26px); line-height: 1.4; }
  #cNote { font-size: 13px; opacity: 0.7; }
  #cMap { width: 100%; max-width: 520px; height: auto; border-radius: 10px; }
  #cBars { width: 100%; display: grid; gap: 6px; }
  .cbar { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .cbar div { flex: 1; height: 10px; background: #2b3b47; border-radius: 6px; overflow: hidden; }
  .cbar i { display: block; height: 100%; background: #8be07a; transition: width 0.2s; }
  #calib button { font: inherit; padding: 0.6em 1.2em; border-radius: 10px; border: 0; background: #2b3b47; color: #fff8e6; cursor: pointer; }
  #calib #cRetry { background: #f2b544; color: #1d1d1d; font-weight: 700; }
  .cbtns { display: flex; gap: 10px; }
  /* phone mode */
  #turnPhone { display: none; }
  @media (orientation: portrait) {
    body.phone #turnPhone { display: flex; position: fixed; inset: 0; z-index: 50; background: #10202b; color: #fff8e6;
      align-items: center; justify-content: center; text-align: center; font: 700 28px system-ui, sans-serif; line-height: 1.6; }
  }
  body.phone #lobby .pc-only { display: none; }
  body.phone.show-qr #lobby .pc-only { display: revert; }
  #lobby button.big { font-size: 1.5em; padding: 0.8em 1.4em; background: #f2b544; color: #1d1d1d; font-weight: 700; }
  #lobby button.big:hover { background: #ffc85c; }
  #hud {
    position: absolute; right: 0.6%; top: 1%; padding: 4px 8px; border-radius: 8px;
    background: rgba(0, 0, 0, 0.5); color: #e8f4fa; font: 11px/1.35 ui-monospace, Menlo, monospace; pointer-events: none;
  }

  <div id="turnPhone">↻<br>Turn your phone sideways</div>

<script type="module">
// Version check. GitHub Pages lets browsers keep files for 10 minutes, so before
// starting, make sure this page and all its code are the newest build.
const BUILD = document.querySelector('meta[name=build]').content;
try {
  const v = await fetch('version.json', { cache: 'no-store' }).then((r) => r.json());
  const u = new URL(location.href);
  if (v.build !== BUILD && u.searchParams.get('v') !== v.build) {
    u.searchParams.set('v', v.build);                    // the page itself is old: reload it past the cache
    location.replace(u);
    await new Promise(() => {});
  }
  if (localStorage.getItem('ark-build') !== v.build) {    // new build: refresh every code file in the cache
    await Promise.all(v.files.map((f) => fetch(f, { cache: 'reload' }).catch(() => {})));
    try { localStorage.setItem('ark-build', v.build); } catch (_) {}
  }
} catch (_) { /* offline or no version.json: just start */ }
await import('./js/main.js');
</script>
